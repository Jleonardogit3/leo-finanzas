<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldDollar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#10B981" stroke-opacity="0.3" stroke-width="8" />

  <!-- Inner Circle Seal -->
  <circle cx="256" cy="235" r="150" fill="#1E293B" stroke="#334155" stroke-width="6" />

  <!-- Stylized Currency Sign -->
  <text 
    x="256" 
    y="305" 
    text-anchor="middle" 
    fill="url(#goldDollar)" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="220"
    filter="url(#glow)"
  >
    $
  </text>

  <!-- Venezuelan Tricolor Bar (Yellow, Blue, Red) -->
  <g transform="translate(146, 420)">
    <rect x="0" y="0" width="70" height="18" rx="9" fill="#FBBF24" />
    <rect x="75" y="0" width="70" height="18" rx="9" fill="#2563EB" />
    <rect x="150" y="0" width="70" height="18" rx="9" fill="#E11D48" />
  </g>
</svg>
